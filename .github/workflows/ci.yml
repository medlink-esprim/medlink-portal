# US-58 : intégration continue. À chaque pull request et à chaque fusion sur main :
#   backend  : schéma SQL, lint (ESLint), tests Jest/Supertest sur une vraie base PostgreSQL 16,
#              analyse des dépendances (npm audit)
#   frontend : build de production (Vite) et analyse des dépendances
# Le résultat apparaît sur la pull request ; une règle de protection de main peut exiger qu'il soit vert.
name: CI

on:
  pull_request:
  push:
    branches: [main, 'ci-verif/**']

permissions:
  contents: write

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: medlink
          POSTGRES_PASSWORD: ci-medlink
          POSTGRES_DB: medlink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medlink"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025"]
    env:
      DATABASE_URL: postgres://medlink:ci-medlink@localhost:5432/medlink
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      APP_URL: http://localhost:5173
      SMTP_URL: smtp://localhost:1025
      MAIL_FROM: MedLink CI <ci@medlink.local>
      RAPPELS_ACTIFS: "false"
      DOCUMENTS_DIR: /tmp/medlink-documents
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Clé de chiffrement de test (générée à chaque exécution)
        run: echo "CHIFFREMENT_CLES=1:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Schéma de la base (toutes les migrations)
        run: for f in ../db/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Installation des dépendances
        run: npm ci --no-audit --no-fund
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tests Jest / Supertest
        run: npm test
      - name: Analyse des dépendances de production
        run: npm audit --omit=dev --audit-level=critical

  frontend:
    name: Frontend (build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installation des dépendances
        run: npm ci --no-audit --no-fund
      - name: Build de production
        run: npm run build
      - name: Build publié sur une branche (vérification temporaire)
        run: |
          cd dist && git init -q -b dist && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm dist
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dist:refs/heads/ci-verif/design-dist
      - name: Analyse des dépendances de production
        run: npm audit --omit=dev --audit-level=critical
