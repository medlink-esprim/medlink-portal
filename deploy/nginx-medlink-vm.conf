# /etc/nginx/sites-available/medlink — VM de démonstration, certificat mkcert (US-44)
# Même configuration que nginx-medlink.conf (VPS), seuls le nom et le certificat changent.
# Le certificat est créé sur le PC Windows : mkcert medlink.local, puis copié dans /etc/ssl/medlink/

# Tout le trafic HTTP est redirigé vers HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name medlink.local;
  server_tokens off;
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;   # syntaxe acceptée par Nginx 1.24 (Ubuntu 24.04) et 1.28
  listen [::]:443 ssl http2;
  server_name medlink.local;
  server_tokens off;
  client_max_body_size 12m;   # US-25 : PDF de résultats jusqu'à 10 Mo (l'API limite le JSON à 100 ko)

  ssl_certificate     /etc/ssl/medlink/medlink.local.pem;
  ssl_certificate_key /etc/ssl/medlink/medlink.local-key.pem;

  # TLS 1.2 minimum, TLS 1.3 privilégié (négocié dès que le navigateur le supporte)
  ssl_protocols TLSv1.2 TLSv1.3;
  # suites TLS 1.2 avec confidentialité persistante (ECDHE) et chiffrement authentifié uniquement
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:MedLink:10m;
  ssl_session_tickets off;

  # HSTS : le navigateur refuse ensuite tout accès en HTTP pendant un an
  add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
