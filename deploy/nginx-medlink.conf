# /etc/nginx/sites-available/medlink — Nginx de l'hôte (VPS)
# Remplacer medlink.example.tn par votre domaine, puis : sudo certbot --nginx -d medlink.example.tn
server {
  listen 80;
  server_name medlink.example.tn;
  server_tokens off;
  client_max_body_size 1m;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
