# /etc/nginx/sites-available/medlink — Nginx de l'hôte, VPS avec un nom de domaine (US-44)
# Remplacer medlink.example.tn par votre domaine. Certificat : sudo certbot certonly --nginx -d medlink.example.tn
# (sur la VM de démonstration avec mkcert : utiliser nginx-medlink-vm.conf)

# Tout le trafic HTTP est redirigé vers HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name medlink.example.tn;
  server_tokens off;
  location /.well-known/acme-challenge/ { root /var/www/html; }   # renouvellement Certbot
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name medlink.example.tn;
  server_tokens off;
  client_max_body_size 1m;

  ssl_certificate     /etc/letsencrypt/live/medlink.example.tn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/medlink.example.tn/privkey.pem;

  # TLS 1.2 minimum, TLS 1.3 privilégié (négocié dès que le navigateur le supporte)
  ssl_protocols TLSv1.2 TLSv1.3;
  # suites TLS 1.2 avec confidentialité persistante (ECDHE) et chiffrement authentifié uniquement
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:MedLink:10m;
  ssl_session_tickets off;

  # HSTS : le navigateur refuse ensuite tout accès en HTTP pendant un an
  add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
