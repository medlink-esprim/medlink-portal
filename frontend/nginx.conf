# Nginx du conteneur web (production) : sert l'application React et relaie /api vers l'API.
server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;

  # US-44 : en-têtes de sécurité des pages (l'API a les siens via helmet)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  # US-61 (corrections du scan ZAP) : isolation de l'origine, fonctions du navigateur inutiles coupées
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  location /api/ {
    client_max_body_size 12m;   # US-25 : publication de PDF (10 Mo maximum, contrôlé par l'API)
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # application React : toutes les autres URL renvoient index.html
  location / {
    try_files $uri /index.html;
  }
}
